name: Windows build and safety checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, test and package
        shell: powershell
        run: ./scripts/Build.ps1 -Publish -Setup -NetworkTests
      - name: Verify bundled setup and isolated installation
        shell: powershell
        run: ./scripts/Test-Package.ps1
      - name: Render all screens without hardware
        shell: powershell
        run: |
          $p = Start-Process -FilePath artifacts/AirScope-win-x64/AirScope.exe -ArgumentList '--smoke-test','--output',"$pwd/artifacts/ui-smoke/result.private.json" -WindowStyle Hidden -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'UI smoke test failed' }
          $result = Get-Content artifacts/ui-smoke/result.private.json -Raw | ConvertFrom-Json
          if (!$result.success -or $result.bindingErrors -or $result.pages -ne 8 -or $result.toolPages -ne 6) { throw 'UI or binding validation failed' }
      - name: Verify windowless background mode
        shell: powershell
        run: |
          $p = Start-Process -FilePath artifacts/AirScope-win-x64/AirScope.exe -ArgumentList '--background-smoke','--output',"$pwd/artifacts/background-smoke/result.private.json" -WindowStyle Hidden -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Background smoke test failed' }
          $result = Get-Content artifacts/background-smoke/result.private.json -Raw | ConvertFrom-Json
          if (!$result.success -or $result.windows -ne 0) { throw 'Background mode created a window' }
      - uses: actions/upload-artifact@v4
        with:
          name: AirScope-windows-x64
          path: |
            artifacts/AirScope-win-x64.zip
            artifacts/AirScope-Setup.exe
            artifacts/AirScope-update.json
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
  release:
    needs: windows
    if: github.repository == 'djgringoboy2003/wifi-analyser' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AirScope-windows-x64
          path: artifacts
      - name: Publish a new version after every check passes
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$properties=Get-Content Directory.Build.props
          $version=[string]$properties.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          $tag='v'+$version
          if ($env:GITHUB_REF.StartsWith('refs/tags/') -and $env:GITHUB_REF -ne ('refs/tags/'+$tag)) { throw 'The tag does not match the product version' }
          $releases=& gh release list --limit 1000 --json tagName,isDraft
          if ($LASTEXITCODE -ne 0) { throw 'Could not read existing releases' }
          $existing=@(($releases | ConvertFrom-Json) | Where-Object { $_.tagName -eq $tag })
          if ($existing.Count -gt 0) {
            if (!$existing[0].isDraft) { Write-Output 'This version is already published; its assets are unchanged.'; exit 0 }
            & gh release edit $tag --target $env:GITHUB_SHA --notes-file docs/RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not refresh the draft release' }
          } else {
            & gh release create $tag --target $env:GITHUB_SHA --title ('AirScope '+$version) --notes-file docs/RELEASE_NOTES.md --draft
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release' }
          }
          & gh release upload $tag artifacts/AirScope-win-x64.zip artifacts/AirScope-Setup.exe artifacts/AirScope-update.json artifacts/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed; the release remains a draft' }
          & gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the verified release' }
